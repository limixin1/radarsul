name: Validação SENTINELA
on:
  pull_request:
  push:
    branches: [main, correcao/sentinela-auditoria]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m src.data_package validate
      - run: python -m compileall -q app.py app_antt.py src tests
      - run: python -m pytest -q --junitxml=pytest.xml
      - run: python -m pip_audit --progress-spinner off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pytest
          path: pytest.xml
