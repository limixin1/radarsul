services:
  - type: web
    name: radarsul
    runtime: python
    plan: free
    region: virginia
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    domains:
      - radarsul.site
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
