<section class="sentinela-map notranslate" translate="no" aria-label="Mapa do corredor BR-101">
  <div class="map-toolbar">
    <div class="map-brand"><span>SENTINELA / BR-101 SC</span><strong>Corredor rodoviário</strong></div>
    <div class="map-tools" role="group" aria-label="Controles do mapa">
      <button type="button" data-mode="2d" aria-pressed="true">Mapa 2D</button>
      <button type="button" data-mode="satellite" aria-pressed="false">Satélite</button>
      <button type="button" data-action="reset">Ver corredor</button>
      <button type="button" data-action="export" aria-label="Baixar mapa 2D em PNG">PNG 2D</button>
    </div>
  </div>
  <div class="map-canvas" role="region" aria-label="Mapa interativo. Use as setas para mover e mais ou menos para ampliar."></div>
  <div class="map-legend" aria-label="Legenda do mapa">
    <span><i class="axis"></i>Eixo DNIT</span><span><i class="radar"></i>Equipamento</span>
    <span><i class="prf"></i>Ocorrência PRF</span><span><i class="segment"></i>Referência por km</span>
    <span><i class="focus"></i>Seleção</span>
  </div>
  <div class="map-credits"><span data-credit="axis"></span> <span data-credit="satellite" hidden></span></div>
  <p class="map-status" role="status" aria-live="polite" hidden></p>
</section>
